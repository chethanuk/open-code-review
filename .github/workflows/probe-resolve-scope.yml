# THROWAWAY PROBE - delete after reading the result.
# Question: can a GITHUB_TOKEN scoped exactly like ocr-review.yml
# (contents: read + pull-requests: write) execute resolveReviewThread?
name: probe-resolve-scope
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const files = await github.rest.pulls.listFiles({ owner, repo, pull_number: pr.number });
            const target = files.data.find(f => f.filename.endsWith('probe-target.txt'));
            core.info('anchor file: ' + target.filename);

            const rc = await github.rest.pulls.createReviewComment({
              owner, repo, pull_number: pr.number,
              commit_id: pr.head.sha,
              path: target.filename, line: 1,
              body: 'probe: resolve-scope test comment',
            });
            core.info('posted review comment id=' + rc.data.id);

            const q = await github.graphql(
              `query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){pullRequest(number:$n){
                 reviewThreads(first:50){nodes{id isResolved viewerCanResolve comments(first:5){nodes{databaseId}}}}}}}`,
              { o: owner, r: repo, n: pr.number });
            const t = q.repository.pullRequest.reviewThreads.nodes
              .find(x => x.comments.nodes.some(c => c.databaseId === rc.data.id));
            core.info('thread: ' + JSON.stringify(t));
            core.notice('VIEWER_CAN_RESOLVE=' + (t && t.viewerCanResolve));

            try {
              const res = await github.graphql(
                `mutation($id:ID!){resolveReviewThread(input:{threadId:$id}){thread{id isResolved}}}`,
                { id: t.id });
              core.notice('RESOLVE_RESULT=OK ' + JSON.stringify(res.resolveReviewThread.thread));
            } catch (e) {
              core.notice('RESOLVE_RESULT=FAILED ' + e.message);
            }
