name: PROBE resolveReviewThread scope test

on:
  workflow_dispatch:
    inputs:
      pr_number:
        default: "23"

# Matches ocr-review.yml:31-33 exactly.
permissions:
  contents: read
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Create a review comment thread (simulating OCR bot)
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: ${{ inputs.pr_number }}});
            const comment = await github.rest.pulls.createReviewComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ inputs.pr_number }},
              body: 'PROBE: synthetic OCR-style inline comment for resolveReviewThread scope test.',
              commit_id: pr.data.head.sha,
              path: '.github/dependabot.yml',
              line: 20,
              side: 'RIGHT'
            });
            console.log('comment_id=' + comment.data.id);
            console.log('commenter_login=' + comment.data.user.login);
            console.log('commenter_type=' + comment.data.user.type);
            core.setOutput('comment_id', comment.data.id);

      - name: Find the review thread id via GraphQL
        id: thread
        uses: actions/github-script@v7
        with:
          script: |
            const q = `query($owner:String!,$repo:String!,$pr:Int!) {
              repository(owner:$owner, name:$repo) {
                pullRequest(number:$pr) {
                  reviewThreads(last: 5) {
                    nodes { id isResolved isOutdated comments(last:1) { nodes { databaseId body } } }
                  }
                }
              }
            }`;
            const result = await github.graphql(q, {owner: context.repo.owner, repo: context.repo.repo, pr: ${{ inputs.pr_number }}});
            console.log(JSON.stringify(result, null, 2));
            const target = result.repository.pullRequest.reviewThreads.nodes.find(
              n => n.comments.nodes[0] && n.comments.nodes[0].databaseId === ${{ steps.create.outputs.comment_id }}
            );
            if (!target) { core.setFailed('could not find thread for comment'); return; }
            console.log('thread_id=' + target.id);
            core.setOutput('thread_id', target.id);

      - name: Attempt resolveReviewThread mutation with contents:read + pull-requests:write token
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const m = `mutation($id:ID!) {
              resolveReviewThread(input:{threadId:$id}) {
                thread { id isResolved }
              }
            }`;
            try {
              const result = await github.graphql(m, { id: '${{ steps.thread.outputs.thread_id }}' });
              console.log('MUTATION_SUCCESS');
              console.log(JSON.stringify(result, null, 2));
            } catch (e) {
              console.log('MUTATION_FAILED');
              console.log('status=' + e.status);
              console.log('message=' + e.message);
              console.log(JSON.stringify(e.errors || e, null, 2));
              core.setFailed('resolveReviewThread failed: ' + e.message);
            }

      - name: Report actor/token identity used
        run: |
          echo "github.actor=${{ github.actor }}"
          echo "event=${{ github.event_name }}"
